spring.application.name=rbac-audit-system

# --- Database ---
# Point this at your local Postgres (see docker command in README).
spring.datasource.url=jdbc:postgresql://localhost:5432/rbac_audit_db
spring.datasource.username=rbac_app
spring.datasource.password=changeme_in_local_env
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' is convenient for Phase 0-1 development. Once the schema
# stabilizes (Phase 4), switch to a real migration tool (Flyway/Liquibase)
# and set this to 'validate' - letting Hibernate auto-alter production
# schemas is a bad habit to demo in an interview.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (Phase 2) ---
# Never commit a real secret. Override this via an environment variable
# (JWT_SECRET) in any environment that isn't your own laptop.
app.jwt.secret=${JWT_SECRET:temporary-dev-only-secret-change-me-32bytes-min}
app.jwt.expiration-minutes=30

server.port=8080
